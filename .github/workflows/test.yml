name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Heavy jobs (backend-tests, e2e-tests) run inside the pre-built CI
# image with Rust / tauri-driver / cargo-chef-cooked deps baked in.
# Frontend-only jobs (frontend-tests, quality-checks) run inside the
# stock node:24-slim — pulling the heavy image just to run vitest or
# eslint would dwarf the actual work.

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    container: node:24-slim

    steps:
    - name: Install OS deps for actions/checkout + codecov
      # node:24-slim ships without git or gpg, both of which the codecov
      # action shells out to. apt is fast (a few seconds) so adding them
      # is cheaper than swapping to the full node:24 image.
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git gnupg ca-certificates
        rm -rf /var/lib/apt/lists/*

    - uses: actions/checkout@v4

    - name: Install pnpm
      run: npm install -g pnpm@latest

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      run: pnpm install

    - name: Run unit tests
      run: pnpm test:run

    - name: Generate coverage report
      run: pnpm test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  backend-tests:
    runs-on: ubuntu-latest
    container: ghcr.io/ktat/photoclove-ci:latest

    steps:
    - uses: actions/checkout@v4

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Create dummy files for Tauri build
      run: |
        mkdir -p src-tauri/models && touch src-tauri/models/dummy.onnx
        mkdir -p dist

    - name: Run backend tests
      run: cd src-tauri && cargo test

    - name: Run clippy
      run: cd src-tauri && cargo clippy -- -D warnings

    - name: Check formatting
      run: cd src-tauri && cargo fmt --check

  e2e-tests:
    runs-on: ubuntu-latest
    container: ghcr.io/ktat/photoclove-ci:latest

    steps:
    - uses: actions/checkout@v4

    - name: Install sqlite3 CLI
      # e2e/fixtures.js seeds the test fixture DB with pre-unlocked
      # achievement_progress rows so the AchievementPopup overlay
      # doesn't intercept clicks during a test run. Needs the sqlite3
      # CLI (the photoclove-ci image doesn't ship it).
      run: |
        if ! command -v sqlite3 >/dev/null 2>&1; then
          apt-get update
          apt-get install -y --no-install-recommends sqlite3
        fi

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: /usr/local/pnpm-store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install dependencies
      run: pnpm install

    - name: Create dummy ONNX file for Tauri build
      # tauri.conf.json bundle.resources globs `models/*.onnx`, and the
      # build script aborts when the glob matches nothing. The real
      # mobilenet model is gitignored (too big), so seed a placeholder
      # — `tauri build --no-bundle` doesn't actually copy it anywhere.
      run: |
        mkdir -p src-tauri/models && touch src-tauri/models/dummy.onnx

    - name: Run E2E tests
      run: xvfb-run --auto-servernum pnpm test:e2e

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          test-results/
        retention-days: 30

  quality-checks:
    runs-on: ubuntu-latest
    container: node:24-slim

    steps:
    - name: Install OS deps for actions/checkout
      run: |
        apt-get update
        apt-get install -y --no-install-recommends git ca-certificates
        rm -rf /var/lib/apt/lists/*

    - uses: actions/checkout@v4

    - name: Install pnpm
      run: npm install -g pnpm@latest

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.local/share/pnpm/store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      run: pnpm install

    - name: Run ESLint
      run: pnpm exec eslint src --ext .js,.jsx,.ts,.tsx --max-warnings 0
      continue-on-error: true

    - name: Run Prettier check
      run: pnpm exec prettier --check src
      continue-on-error: true

    - name: Check for security vulnerabilities
      run: pnpm audit --audit-level moderate
      continue-on-error: true
