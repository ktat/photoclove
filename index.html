<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>&#x1f980;Photoclove</title>
  <style>
    #firstView {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 40px;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      color: white;
    }
    #firstView h1 {
      margin: 0 0 24px 0;
      font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .loading-dots {
      display: inline-flex;
      margin-left: 2px;
    }
    .loading-dots .dot {
      animation: dot-blink 0.6s ease-in-out infinite;
      opacity: 0;
    }
    .loading-dots .dot:nth-child(1) { animation-delay: 0s; }
    .loading-dots .dot:nth-child(2) { animation-delay: 0.1s; }
    .loading-dots .dot:nth-child(3) { animation-delay: 0.2s; }
    @keyframes dot-blink {
      0%, 20% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }
    .loading-scene {
      position: relative;
      width: 250px;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }
    .loading-crab {
      font-size: 80px;
      animation: crabDance 1s ease-in-out infinite;
      z-index: 2;
    }
    @keyframes crabDance {
      0% { transform: translateX(-40px) rotate(-12deg); }
      25% { transform: translateX(0) translateY(-20px) rotate(0deg); }
      50% { transform: translateX(40px) rotate(12deg); }
      75% { transform: translateX(0) translateY(-20px) rotate(0deg); }
      100% { transform: translateX(-40px) rotate(-12deg); }
    }
    .loading-camera {
      position: absolute;
      font-size: 40px;
      animation: cameraFloat 2s ease-in-out infinite;
    }
    .loading-camera:nth-child(2) {
      top: 0;
      right: 20px;
      animation-delay: 0s;
    }
    .loading-camera:nth-child(3) {
      top: 30px;
      left: 0;
      animation-delay: 0.6s;
    }
    .loading-camera:nth-child(4) {
      bottom: 10px;
      right: 40px;
      animation-delay: 1.2s;
    }
    @keyframes cameraFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg) scale(1); opacity: 0.6; }
      50% { transform: translateY(-25px) rotate(10deg) scale(1.2); opacity: 1; }
    }
    .loading-flash {
      position: absolute;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
      animation: flash 2s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes flash {
      0%, 40%, 60%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    #firstView .splash-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px;
      background: #242424;
      border: 1px solid #333333;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    #firstView .splash-frame img {
      max-width: 80vw;
      max-height: 65vh;
      border-radius: 12px;
      object-fit: contain;
    }
  </style>
</head>

<body style="margin: 0px; padding: 0px; overflow: hidden">
  <div id="root" style="margin: 0px; padding: 0px; overflow: hidden">
    <div id="firstView">
      <div class="loading-scene">
        <div class="loading-crab">&#x1f980;</div>
        <div class="loading-camera">&#x1f4f7;</div>
        <div class="loading-camera">&#x1f4f7;</div>
        <div class="loading-camera">&#x1f4f7;</div>
        <div class="loading-flash"></div>
      </div>
      <h1>PhotoClove is Loading <span class="loading-dots"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span></h1>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </div>
</body>

</html>
