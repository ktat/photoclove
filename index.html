<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photoclove</title>
  <style>
    #firstView {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      background-color: #1b1b1b;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
      color: white;
      position: relative;
      overflow: hidden;
    }
    #firstView .splash-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    #firstView .splash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2;
    }
    #firstView h1 {
      position: relative;
      z-index: 3;
      margin: 0;
      font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
      font-size: 28px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }
    .loading-dots {
      display: inline-block;
    }
    .loading-dots .dot {
      display: inline-block;
      animation: glow-dot 1.5s ease-in-out infinite;
    }
    .loading-dots .dot:nth-child(1) { animation-delay: 0s; }
    .loading-dots .dot:nth-child(2) { animation-delay: 0.3s; }
    .loading-dots .dot:nth-child(3) { animation-delay: 0.6s; }
    @keyframes glow-dot {
      0%, 20% { opacity: 0.3; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
      50% { opacity: 1; text-shadow: 0 0 10px #4a9eff, 0 2px 10px rgba(0, 0, 0, 0.8); }
      80%, 100% { opacity: 0.3; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
    }
    #firstView .splash-frame {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px;
      background: #242424;
      border: 1px solid #333333;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    #firstView .splash-frame img {
      max-width: 80vw;
      max-height: 65vh;
      border-radius: 12px;
      object-fit: contain;
    }
  </style>
</head>

<body style="margin: 0px; padding: 0px; overflow: hidden">
  <div id="root" style="margin: 0px; padding: 0px; overflow: hidden">
    <div id="firstView">
      <img class="splash-bg" id="splash-bg" src="/bird.jpg" alt="">
      <div class="splash-overlay"></div>
      <h1>PhotoClove is Loading<span class="loading-dots"><span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span></h1>
    </div>
    <script>
      // Pick a random background image
      const images = ['/bird.jpg', '/mountain.jpg', '/raityou.jpg', '/midagahara.jpg', '/kamikochi.jpg', '/monkey.jpg'];
      document.getElementById('splash-bg').src = images[Math.floor(Math.random() * images.length)];
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </div>
</body>

</html>
