[package]
name = "photoclove"
version = "0.0.1"
description = "A simple & fast photo manager"
authors = ["ktat"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.84.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-cli = "2"
serde_json = "1.0.139"
serde = { version = "1.0.218", features = ["derive"] }
tauri = { version = "2", features = [ "protocol-asset"] }
chrono = { version = "0.4", features = ["unstable-locales"] }
rusqlite = { version = "*", features = ["bundled"] }
rexif = "0.7.3"
linked-hash-map = "0.5.6"
regex = "1.7.0"
filetime = "*"
fs2 = "0.4"
tempfile = "*"
dirs = "*"
url = "*"
serde_yaml = "*"
async-trait = "0.1.36"
image_compressor = "1.3.0"
futures = "0.3.5"
reqwest = "*"
path_abs = "*"
tauri-plugin-oauth = { git = "https://github.com/FabianLars/tauri-plugin-oauth/", branch = "v2"}
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
uuid = { version = "1.0", features = ["v1", "v4"] }
sha2 = "0.10.9"
image = "0.24"
tokio = { version = "1.0", features = ["full"] }
# tauri-plugin-shell = "2"
# turbojpeg-sys = {version = "0.2.3", features = ["bindgen"] }
# turbojpeg = {version = "0.5", features = ["image"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "photoclove"
path = "src/main.rs"
