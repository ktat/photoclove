[package]
name = "s3-backup"
version = "0.0.1"
edition = "2021"

[dependencies]
aws-config = { version = "1.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.15"
aws-credential-types = "1.1"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net"] } 
log = "0.4"
serde_json = "1.0"
dirs = "*"
rusqlite = { version = "*", features = ["bundled"] }
